; global: how stunnel itself runs
setuid = stunnel4
setgid = stunnel4


foreground = yes
pid =
debug = info

; one guarded door: DoT in, plain DNS out to Unbound
[dot]
accept = 0.0.0.0:853
connect = 127.0.0.1:53

; the gateway's own passport + signature
cert = /etc/stunnel/gateway.crt
key = /etc/stunnel/gateway.key

; check every client's passport against the lab CA
CAfile = /etc/stunnel/ca.crt
verifyChain = yes


sslVersionMin = TLSv1.2

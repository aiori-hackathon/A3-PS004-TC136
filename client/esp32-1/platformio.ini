; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pi

; shared by both modes
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_singleapp_large.csv
; one sdkconfig for both envs (default would be sdkconfig.<env>, i.e. fresh ones)
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32-s3-devkitc-1
board_build.embed_txtfiles =
    certs/ca.crt
    certs/esp32-1.crt
    certs/esp32-1.key

; mode 1: stunnel in containerlab on the laptop
[env:lab]
build_flags =
    '-D GATEWAY_IP="10.174.132.72"'
    -D GATEWAY_PORT=8530

; mode 2: stunnel + unbound on the pi
[env:pi]
build_flags =
    '-D GATEWAY_IP="10.174.132.118"'
    -D GATEWAY_PORT=853

; attack test: the laptop plays a rogue gateway (fake CA cert) on :8531
[env:rogue]
build_flags =
    '-D GATEWAY_IP="10.174.132.72"'
    -D GATEWAY_PORT=8531

; benchmark: 50 rounds x 9 names, one CSV line per query (Q,...) and per handshake (H,...)
; bench-pi: one TLS connection for all rounds. bench-pi-new: a new connection (handshake) every round
[env:bench-pi]
extends = env:pi
build_flags =
    ${env:pi.build_flags}
    -D BENCH_ROUNDS=50

[env:bench-pi-new]
extends = env:pi
build_flags =
    ${env:pi.build_flags}
    -D BENCH_ROUNDS=50
    -D BENCH_NEW_CONN=1

; baseline: the same nine names as plain DNS over UDP to the Pi (no TLS). The Pi's Unbound must
; temporarily listen on its Wi-Fi address, see EXPERIMENTS.md
[env:bench-udp]
extends = env:pi
build_flags =
    ${env:pi.build_flags}
    -D BENCH_ROUNDS=50
    -D PLAIN_DNS_PORT=53

; crypto cost on the chip, no Wi-Fi: SHA-256 and ECDSA P-256 verify timings
[env:crypto-bench]
extends = env:pi
build_flags =
    ${env:pi.build_flags}
    -D CRYPTO_BENCH

; certificate dates checked: its own sdkconfig copy turns on MBEDTLS_HAVE_TIME_DATE, and the clock is
; set over SNTP from NTP_SERVER_IP before the TLS connect (an NTP server on the Pi or laptop is needed)
[env:sntp]
extends = env:pi
board_build.esp-idf.sdkconfig_path = sdkconfig.sntp
build_flags =
    ${env:pi.build_flags}
    '-D NTP_SERVER_IP="10.174.132.118"'


; pin the gateway: besides the CA check, the SHA-256 of the gateway's public key must match the pin below.
; its own sdkconfig copy keeps the peer certificate after the handshake (needed to read its key)
[env:pin]
extends = env:pi
board_build.esp-idf.sdkconfig_path = sdkconfig.pin
build_flags =
    ${env:pi.build_flags}
    '-D GATEWAY_PIN_SHA256="5e9497d814771344c6bb9239bfa4f5ef5c3c9f1feafac67c6ae331de4d0c18ef"'

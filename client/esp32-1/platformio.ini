; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = pi

; shared by both modes
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions_singleapp_large.csv
; one sdkconfig for both envs (default would be sdkconfig.<env>, i.e. fresh ones)
board_build.esp-idf.sdkconfig_path = sdkconfig.esp32-s3-devkitc-1
board_build.embed_txtfiles =
    certs/ca.crt
    certs/esp32-1.crt
    certs/esp32-1.key

; mode 1: stunnel in containerlab on the laptop
[env:lab]
build_flags =
    '-D GATEWAY_IP="10.174.132.72"'
    -D GATEWAY_PORT=8530

; mode 2: stunnel + unbound on the pi
[env:pi]
build_flags =
    '-D GATEWAY_IP="10.174.132.118"'
    -D GATEWAY_PORT=853

; attack test: the laptop plays a rogue gateway (fake CA cert) on :8531
[env:rogue]
build_flags =
    '-D GATEWAY_IP="10.174.132.72"'
    -D GATEWAY_PORT=8531

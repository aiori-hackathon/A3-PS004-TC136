<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Inter, 'DejaVu Sans', Arial, sans-serif">
<rect width="1920" height="1080" fill="#fff"/><image href="fig-hardware.png" x="0" y="0" width="1920" height="1080"/>
<rect x="0" y="940" width="700" height="80" fill="#fff"/>
<marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c62828"/></marker>
<line x1="760" y1="520" x2="760" y2="592" stroke="#c62828" stroke-width="8"/>
<rect x="570" y="458" width="190" height="30" rx="15" fill="#fff" stroke="#c62828" stroke-width="3"/><text x="665" y="479" text-anchor="middle" font-size="17" font-weight="700" fill="#c62828">attacks 1, 2, 3</text>
<line x1="610" y1="490" x2="610" y2="490" stroke="#c62828"/>
<rect x="150" y="225" width="215" height="30" rx="15" fill="#fff" stroke="#c62828" stroke-width="3"/><circle cx="166" cy="240" r="12" fill="#c62828"/><text x="166" y="246" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">4</text><text x="186" y="246" font-size="17" font-weight="600" fill="#c62828">Rogue gateway</text>
<line x1="260" y1="257" x2="260" y2="352" stroke="#c62828" stroke-width="4" marker-end="url(#a)" stroke-dasharray="8 6"/>
<text x="252" y="338" font-size="34" font-weight="700" fill="#c62828">✕</text>
<rect x="1020" y="462" width="200" height="30" rx="15" fill="#fff" stroke="#c62828" stroke-width="3"/><circle cx="1036" cy="477" r="12" fill="#c62828"/><text x="1036" y="483" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">5</text><text x="1056" y="483" font-size="17" font-weight="600" fill="#c62828">Gateway down</text>
<text x="1185" y="520" font-size="34" font-weight="700" fill="#c62828">✕</text>
<rect x="1040" y="712" width="185" height="30" rx="15" fill="#fff" stroke="#c62828" stroke-width="3"/><circle cx="1056" cy="727" r="12" fill="#c62828"/><text x="1056" y="733" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">6</text><text x="1076" y="733" font-size="17" font-weight="600" fill="#c62828">CD bit ignored</text>
<rect x="880" y="865" width="215" height="30" rx="15" fill="#fff" stroke="#c62828" stroke-width="3"/><circle cx="896" cy="880" r="12" fill="#c62828"/><text x="896" y="886" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">7</text><text x="916" y="886" font-size="17" font-weight="600" fill="#c62828">Back door closed</text>
<rect x="1260" y="70" width="580" height="330" rx="14" fill="#fff" stroke="#ddd" stroke-width="2"/><text x="1285" y="110" font-size="26" font-weight="700" fill="#1a1a1a">Where each attack is stopped</text>
<circle cx="1295" cy="142" r="12" fill="#c62828"/><text x="1295" y="148" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text><text x="1320" y="148" font-size="19" font-weight="700" fill="#1a1a1a">No certificate</text><text x="1605" y="148" font-size="17" fill="#444">refused at the handshake</text>
<circle cx="1295" cy="178" r="12" fill="#c62828"/><text x="1295" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text><text x="1320" y="184" font-size="19" font-weight="700" fill="#1a1a1a">Fake CA, same name</text><text x="1605" y="184" font-size="17" fill="#444">refused at the handshake</text>
<circle cx="1295" cy="214" r="12" fill="#c62828"/><text x="1295" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text><text x="1320" y="220" font-size="19" font-weight="700" fill="#1a1a1a">Gateway cert as client</text><text x="1605" y="220" font-size="17" fill="#444">refused, wrong purpose</text>
<circle cx="1295" cy="250" r="12" fill="#c62828"/><text x="1295" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text><text x="1320" y="256" font-size="19" font-weight="700" fill="#1a1a1a">Rogue gateway</text><text x="1605" y="256" font-size="17" fill="#444">ESP32 rejects its certificate</text>
<circle cx="1295" cy="286" r="12" fill="#c62828"/><text x="1295" y="292" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text><text x="1320" y="292" font-size="19" font-weight="700" fill="#1a1a1a">Gateway down</text><text x="1605" y="292" font-size="17" fill="#444">ESP32 refuses, no fallback</text>
<circle cx="1295" cy="322" r="12" fill="#c62828"/><text x="1295" y="328" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text><text x="1320" y="328" font-size="19" font-weight="700" fill="#1a1a1a">CD bit set</text><text x="1605" y="328" font-size="17" fill="#444">gateway ignores it</text>
<circle cx="1295" cy="358" r="12" fill="#c62828"/><text x="1295" y="364" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">7</text><text x="1320" y="364" font-size="19" font-weight="700" fill="#1a1a1a">Back door</text><text x="1605" y="364" font-size="17" fill="#444">no port, ACL: stunnel only</text>
</svg>
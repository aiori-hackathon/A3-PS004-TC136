# This is a sample of a minimal configuration file for Knot DNS.
# See knot.conf(5) or refer to the server documentation.

server:
    rundir: "/rundir"
    user: knot:knot
    automatic-acl: on
    listen: [ 0.0.0.0@53, ::1@53 ]

log:
  - target: stdout
    any: info

database:
    storage: "/storage"

#remote:
#  - id: secondary
#    address: 192.168.1.1@53
#
#  - id: primary
#    address: 192.168.2.1@53

template:
  - id: default
    storage: "/config"
    file: "%s.zone"
    zonefile-sync: -1
    zonefile-load: difference-no-serial
    journal-content: all

policy:
  - id: lab-ecdsa
#    keystore: keystore_id ...
#    manual: BOOL
#    single-type-signing: BOOL
    algorithm: ecdsap256sha256
#    ksk-size: SIZE
#    zsk-size: SIZE
#    ksk-shared: BOOL
#    dnskey-ttl: TIME
#   zone-max-ttl: TIME
#    keytag-modulo: INT/INT
#    dnssec-jitter: TIME | INT%
#    ksk-lifetime: TIME
#    zsk-lifetime: TIME
#    deleg-adt: BOOL
#    delete-delay: TIME
#    trash-delay: TIME
#    propagation-delay: TIME
#    rrsig-lifetime: TIME
#    rrsig-refresh: TIME
#    rrsig-pre-refresh: TIME
#    reproducible-signing: BOOL
    nsec3: on
#    nsec3-iterations: INT
#    nsec3-opt-out: BOOL
#    nsec3-salt-length: INT
#    nsec3-salt-lifetime: TIME
#    signing-threads: INT
#    ksk-submission: submission_id
#    ds-push: remote_id | remotes_id ...
#    cds-cdnskey-publish: none | delete-dnssec | rollover | always | double-ds
#    cds-digest-type: sha256 | sha384
#    dnskey-management: full | incremental
#    offline-ksk: BOOL
#    unsafe-operation: none | no-check-keyset | no-update-dnskey | no-update-nsec | no-update-expired ...

zone:
    # Primary zone
  - domain: lab.test
#    notify: secondary
    dnssec-signing: on
    dnssec-policy: lab-ecdsa

#    # Secondary zone
  - domain: unsigned.lab.test 
    dnssec-signing: off 
#    master: primary
#
#
  - domain: signed.lab.test 
    dnssec-signing: on 
    dnssec-policy: lab-ecdsa



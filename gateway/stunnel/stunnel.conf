; global: how stunnel itself runs
foreground = yes
pid =
debug = info

; one guarded door: DoT in, plain DNS out to Unbound
[dot]
accept = 0.0.0.0:853
connect = 10.53.0.3:53

; the gateway's own passport + signature
cert = /pki/gateway.crt
key = /pki/gateway.key

; check every client's passport against the lab CA
CAfile = /pki/ca.crt
verifyChain = yes

sslVersionMin = TLSv1.2
